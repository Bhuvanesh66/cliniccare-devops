{{- $fullname := include "cliniccare.fullname" . -}}
{{- $image := include "cliniccare.image" (dict "ctx" . "component" "backend") -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-backend
  labels:
    {{- include "cliniccare.componentLabels" (dict "ctx" . "component" "backend") | nindent 4 }}
spec:
  {{- if not .Values.hpa.enabled }}
  replicas: {{ .Values.backend.replicas }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "cliniccare.selectorLabels" (dict "ctx" . "component" "backend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cliniccare.componentLabels" (dict "ctx" . "component" "backend") | nindent 8 }}
      annotations:
        # Roll the pods when configuration changes. (The DB secret is not hashed: its
        # password is generated randomly, so a re-render would never match.)
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "cliniccare.podSecurityContext" . | nindent 8 }}
        runAsUser: 10001
        runAsGroup: 10001
      # Spread replicas over nodes so one node failure doesn't take the API down.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "cliniccare.selectorLabels" (dict "ctx" . "component" "backend") | nindent 14 }}
      initContainers:
        # Applies Alembic migrations (and demo data) before the API starts.
        # Safe with several replicas: app.migrate holds a PostgreSQL advisory lock.
        - name: migrate
          image: {{ $image }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "app.migrate"]
          envFrom:
            - configMapRef:
                name: {{ $fullname }}-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: {{ include "cliniccare.secretName" . }}, key: database-url }
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          securityContext:
            {{- include "cliniccare.containerSecurityContext" . | nindent 12 }}
      containers:
        - name: api
          image: {{ $image }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.port }}
          envFrom:
            - configMapRef:
                name: {{ $fullname }}-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: {{ include "cliniccare.secretName" . }}, key: database-url }
          # Liveness: is the process alive? Readiness: can it reach the database?
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 3
            failureThreshold: 20
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          securityContext:
            {{- include "cliniccare.containerSecurityContext" . | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-backend
  labels:
    {{- include "cliniccare.componentLabels" (dict "ctx" . "component" "backend") | nindent 4 }}
  {{- with .Values.backend.serviceAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  selector:
    {{- include "cliniccare.selectorLabels" (dict "ctx" . "component" "backend") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.backend.port }}
      targetPort: http
