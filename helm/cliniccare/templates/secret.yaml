{{- /*
Database credentials. A random password is generated on first install; on
upgrades the existing Secret is looked up and reused, so the password never
changes underneath the running database.
*/ -}}
{{- $secretName := include "cliniccare.secretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $password := .Values.postgres.password -}}
{{- if not $password -}}
{{- if and $existing (index $existing.data "password") -}}
{{- $password = index $existing.data "password" | b64dec -}}
{{- else -}}
{{- $password = randAlphaNum 32 -}}
{{- end -}}
{{- end -}}
{{- $host := printf "%s-postgres" (include "cliniccare.fullname" .) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "cliniccare.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.postgres.username | quote }}
  password: {{ $password | quote }}
  database-url: {{ printf "postgresql+psycopg://%s:%s@%s:5432/%s" .Values.postgres.username $password $host .Values.postgres.database | quote }}
