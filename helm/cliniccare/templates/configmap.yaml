apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cliniccare.fullname" . }}-config
  labels:
    {{- include "cliniccare.labels" . | nindent 4 }}
data:
  ENVIRONMENT: {{ .Values.app.environment | quote }}
  CLINIC_TIMEZONE: {{ .Values.app.clinicTimezone | quote }}
  SEED_DEMO_DATA: {{ .Values.app.seedDemoData | quote }}
