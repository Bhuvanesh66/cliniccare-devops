{{- $fullname := include "cliniccare.fullname" . -}}
{{- if .Values.podDisruptionBudget.enabled }}
{{- range $component := list "backend" "frontend" }}
---
# Keep at least one pod serving during node drains and cluster upgrades.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $fullname }}-{{ $component }}
  labels:
    {{- include "cliniccare.labels" $ | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "cliniccare.selectorLabels" (dict "ctx" $ "component" $component) | nindent 6 }}
{{- end }}
{{- end }}
{{- if .Values.networkPolicy.enabled }}
---
# Only backend pods (API and its migrate init container) may connect to PostgreSQL.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-postgres
  labels:
    {{- include "cliniccare.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "cliniccare.selectorLabels" (dict "ctx" . "component" "postgres") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "cliniccare.selectorLabels" (dict "ctx" . "component" "backend") | nindent 14 }}
      ports:
        - port: 5432
          protocol: TCP
{{- end }}
