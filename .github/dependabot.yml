# Weekly update PRs for every dependency source: libraries, base images,
# GitHub Actions (SHA pins included) and Terraform providers and modules.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule: { interval: weekly }
    groups:
      python: { patterns: ['*'] }

  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    groups:
      npm: { patterns: ['*'] }

  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule: { interval: weekly }
    ignore:
      # Node majors alternate between LTS and short-lived releases; move to
      # the next LTS line deliberately rather than on every major.
      - dependency-name: node
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ['*'] }

  - package-ecosystem: terraform
    directory: /terraform
    schedule: { interval: weekly }
