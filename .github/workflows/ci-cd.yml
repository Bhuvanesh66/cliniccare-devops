name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege by default; jobs ask for more only where they need it.
permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TRIVY_VERSION: v0.75.0

# Third-party actions are pinned to full commit SHAs (tags can be moved,
# as happened to trivy-action in March 2026). The comment shows the version.
jobs:
  backend:
    name: Backend - lint and test
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      # First quality gate: a failing test stops the pipeline before any image is built.
      - name: Test (pytest)
        run: pytest -v --cov=app --cov-report=term --junitxml=pytest-report.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pytest-report
          path: backend/pytest-report.xml

  frontend:
    name: Frontend - format check and build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run format:check
      - run: npm run build

  infrastructure:
    name: Infrastructure - validate Terraform, Helm and manifests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false

      - name: Terraform fmt and validate
        working-directory: terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0

      - name: Helm lint and render
        run: |
          helm lint helm/cliniccare --set image.tag=ci -f helm/cliniccare/values-prod.yaml
          helm template cliniccare helm/cliniccare -n cliniccare --set image.tag=ci \
            -f helm/cliniccare/values-prod.yaml > rendered.yaml

      - name: Validate manifests against the Kubernetes 1.36 schemas
        run: |
          { cat rendered.yaml; for f in k8s/*.yaml scripts/load-test-job.yaml; do printf '\n---\n'; cat "$f"; done; } |
            docker run -i --rm ghcr.io/yannh/kubeconform:v0.8.0@sha256:faffaf43f95aa6425306e1ab8d6fcad72acb9049158f38e574c085ea1ec0f64e \
              -strict -summary -kubernetes-version 1.36.0 -ignore-missing-schemas -

  images:
    name: Image - ${{ matrix.component }} (build, scan, push)
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Image names must be lowercase; the GitHub owner name may not be.
      - name: Compute image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cliniccare-${{ matrix.component }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (tagged with the commit SHA)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.component }}
          load: true
          push: false
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          build-args: GIT_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=cliniccare-${{ matrix.component }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

      # Security gate: any fixable HIGH or CRITICAL CVE fails the job, so the
      # image is never pushed.
      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          version: ${{ env.TRIVY_VERSION }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push "$IMAGE:$GITHUB_SHA"
          echo "Pushed \`$IMAGE:$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"

  # Runs only while the EKS cluster exists: scripts/configure-github.sh sets
  # DEPLOY_ENABLED=true after `terraform apply` and false after teardown.
  deploy:
    name: Deploy to EKS
    needs: [images, infrastructure]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # GitHub OIDC token -> short-lived AWS credentials, no stored keys
    environment:
      name: production
      url: ${{ steps.smoke.outputs.url }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: cliniccare-deploy-${{ github.run_id }}

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0

      - name: Connect kubectl to the cluster
        run: aws eks update-kubeconfig --name "${{ vars.EKS_CLUSTER_NAME }}" --region "${{ vars.AWS_REGION }}"

      # --rollback-on-failure: if the new pods never become ready, Helm restores
      # the previous release, so a bad build can't stay deployed.
      - name: Helm upgrade
        run: |
          helm upgrade --install cliniccare ./helm/cliniccare \
            --namespace cliniccare \
            -f helm/cliniccare/values-prod.yaml \
            --set image.registry="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" \
            --set image.tag="$GITHUB_SHA" \
            --wait --rollback-on-failure --timeout 10m
          kubectl -n cliniccare get deploy,pods,svc,ingress,hpa

      - name: Smoke test through the load balancer
        id: smoke
        run: |
          for _ in $(seq 1 30); do
            host=$(kubectl -n cliniccare get ingress cliniccare -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
            [ -n "$host" ] && break
            sleep 10
          done
          url="http://$host"
          echo "Waiting for $url to serve commit ${GITHUB_SHA::7}"
          served=""
          for _ in $(seq 1 40); do
            served=$(curl -fsS --max-time 5 "$url/api/info" | jq -r .git_sha || true)
            [ "$served" = "$GITHUB_SHA" ] && break
            sleep 10
          done
          if [ "$served" != "$GITHUB_SHA" ]; then
            echo "::error::$url serves '$served', expected $GITHUB_SHA"
            exit 1
          fi
          curl -fsS "$url/" | grep -q "<title>ClinicCare</title>"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Deployed \`${GITHUB_SHA::7}\` to $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Helm test
        run: helm test cliniccare -n cliniccare --logs
