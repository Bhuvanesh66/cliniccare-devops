# Full ClinicCare stack on one machine:  docker compose up --build
#   UI       http://localhost:3000
#   API docs http://localhost:8000/docs
name: cliniccare

x-database-url: &database-url
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-cliniccare}:${POSTGRES_PASSWORD:-cliniccare}@postgres:5432/${POSTGRES_DB:-cliniccare}

x-backend-build: &backend-build
  context: ./backend
  args:
    GIT_SHA: ${GIT_SHA:-local}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cliniccare}
      POSTGRES_USER: ${POSTGRES_USER:-cliniccare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cliniccare}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot job: apply Alembic migrations and load demo data, then exit.
  migrate:
    build: *backend-build
    image: cliniccare-backend:local
    command: ["python", "-m", "app.migrate"]
    environment:
      <<: *database-url
      SEED_DEMO_DATA: "true"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build: *backend-build
    image: cliniccare-backend:local
    environment:
      <<: *database-url
      ENVIRONMENT: docker-compose
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        GIT_SHA: ${GIT_SHA:-local}
    image: cliniccare-frontend:local
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:8080"

volumes:
  postgres-data:
