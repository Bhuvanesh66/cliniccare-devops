# The pipeline's deploy role gets AmazonEKSAdminPolicy scoped to this
# namespace (Terraform access entry). That EKS policy does not cover custom
# resources, so this Role adds the Prometheus Operator kinds the Helm chart
# creates. Group name comes from the access entry's kubernetes_groups.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cliniccare-deployer-monitoring
  namespace: cliniccare
rules:
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["servicemonitors", "prometheusrules"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cliniccare-deployer-monitoring
  namespace: cliniccare
subjects:
  - kind: Group
    name: cliniccare-deployers
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: cliniccare-deployer-monitoring
  apiGroup: rbac.authorization.k8s.io
