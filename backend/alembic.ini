[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
# The database URL is not stored here: alembic/env.py reads DATABASE_URL
# through app.config, so no credentials end up in version control.

[loggers]
keys = root,sqlalchemy,alembic,cliniccare

[logger_cliniccare]
level = INFO
handlers =
qualname = cliniccare

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
